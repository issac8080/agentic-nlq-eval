[project]
name = "agentic-nlq-eval"
version = "0.1.0"
description = "Research harness comparing text-to-SQL systems on accuracy, faithfulness, and latency."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "pyyaml>=6",
    "python-dotenv>=1",
    "pyspark>=3.5",
    "duckdb>=1.1",
    "pyarrow>=15",
    "langgraph>=0.2",
    "sqlglot>=25",
    "pandas>=2",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "matplotlib>=3.8",
    "tenacity>=8",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nlq"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
