- id: t3q05
  tier: 3
  dataset: tpch
  reference_scale: sf0.01
  question: What is the total profit on returned lines that shipped by truck?
  gold_sql: >
    SELECT ROUND(SUM(profit), 2) AS total_profit FROM order_lines
    WHERE return_flag = 'R' AND ship_mode = 'TRUCK'
  ordered: false
  numeric_tolerance: 0.01
  rounding: half_even
  column_order: name
  gold_answer:
    values:
      - {total_profit: "47552420.53"}
    entities: [TRUCK]
