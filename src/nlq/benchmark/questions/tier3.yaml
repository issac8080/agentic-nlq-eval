# Scaffold: 5 original tier-3 questions (filters and multiple conditions). Gold values are SF0.01.
- id: t3q01
  tier: 3
  dataset: tpch
  reference_scale: sf0.01
  question: How many order lines shipped by AIR during 1995?
  gold_sql: >
    SELECT COUNT(*) AS air_lines FROM order_lines
    WHERE ship_mode = 'AIR'
      AND ship_date >= DATE '1995-01-01'
      AND ship_date < DATE '1996-01-01'
  ordered: false
  numeric_tolerance: 0
  rounding: half_even
  column_order: name
  gold_answer:
    values:
      - {air_lines: 1225}
    entities: [AIR]
